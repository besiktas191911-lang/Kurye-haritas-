name: APK Derle
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Zip'i ac
        run: unzip -q kurye-harita.zip
      - name: Derle
        working-directory: kurye-harita
        run: |
          npm install
          npx cap add android
          npm run icons
          npx cap sync android
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -c "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kurye-harita-apk
          path: kurye-harita/android/app/build/outputs/apk/debug/app-debug.apk
